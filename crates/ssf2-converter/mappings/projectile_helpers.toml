proj_hitbox_idle_matched = 'hitbox0: { {{parts}} }'

proj_hitbox_idle_default = 'hitbox0: { damage: 6, knockbackGrowth: 30, baseKnockback: 65, angle: 0, reversibleAngle: true, directionalInfluence: false, reflectable: true }'

