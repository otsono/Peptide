# Character-only Haxe templates emitted into the character *Stats.hx files (the fighter's
# Script.hx comes from the runtime). `{{slot}}` placeholders are filled at codegen time;
# data tables that drive codegen stay in Rust.

[stats]

# ── HitboxStats.hx ──
# {{char_name}}
hitbox_header = '''
// Hitbox stats for {{char_name}} — converted from SSF2
// SSF2 field mapping:
//   damage → damage
//   direction → angle
//   power/weightKB → baseKnockback
//   kbConstant → knockbackGrowth
//   hitStun → hitstop  (frames of freeze on hit)
//   selfHitStun → selfHitstop
//   hitLag → hitstun   (frames victim can't act)
// limb values inferred from move type — review before use.
{
'''

# {{section}}
hitbox_section_comment = '''

	//{{section}}
'''

# {{name}}, {{prefix}}
hitbox_attack_open = '''
{{prefix}}{{name}}: {
'''

# {{angle}}, {{base_knockback}}, {{damage}}, {{hitstop}}, {{i}}, {{knockback_growth}}, {{self_hitstop}}
hitbox_field_main = '		hitbox{{i}}: { damage: {{damage}}, angle: {{angle}}, baseKnockback: {{base_knockback}}, knockbackGrowth: {{knockback_growth}}, hitstop: {{hitstop}}, selfHitstop: {{self_hitstop}}'

# {{hitstun}}
hitbox_field_hitstun = ', hitstun: {{hitstun}}'

# {{limb}}
hitbox_field_close = '''
, limb: {{limb}} },
'''

hitbox_attack_close = '''
	},
'''

hitbox_emote = '''
	emote: {
		hitbox0: {}
	},
'''

# {{limb}}, {{name}}
hitbox_todo_attack = '''
	{{name}}: {
		hitbox0: { damage: 0 /*TODO*/, angle: 0 /*TODO*/, baseKnockback: 0 /*TODO*/, knockbackGrowth: 0 /*TODO*/, hitstop: -1, selfHitstop: -1, limb: {{limb}} }
	},
'''

hitbox_extras_header = '''

	//SSF2-SPECIFIC (no direct Fraymakers equivalent — map or remove)
'''

hitbox_footer = '''
}
'''


# ── CharacterStats.hx ──
# {{parent}}, {{source_method}}
char_stats_banner = '''
// ─────────────────────────────────────────────────────────────────
// TODO: TRANSFORMATION FORM — manual wiring required.
//
// This character is a Final-Smash / transformation form of
// `{{parent}}` (SSF2 source: {{source_method}}). It ships as a peer
// entity in the SAME .fraytools project as `{{parent}}`, so that
// when Fraymakers exposes a transformation API the parent's
// Script.hx can swap between the two forms at runtime without a
// cross-project asset reload.
//
// Fraymakers does not yet expose that transformation API.
// Selecting this form directly from the FM roster will run
// these stats as-is — NOT what SSF2 does at runtime, where the
// form is entered via the parent's Final Smash trigger.
//
// To replicate the SSF2 behaviour you'll need to script the
// transformation in `{{parent}}`'s Script.hx (likely by swapping
// resources / stats / animations into the parent at the Final
// Smash trigger). Track the upstream FM API request:
//   https://github.com/Fraymakers (no transformation API yet)
// ─────────────────────────────────────────────────────────────────
'''

# {{aerial_cap}}, {{aerial_cap_todo}}, {{aerial_fric}}, {{aerial_fric_todo}}, {{aerial_speed_accel}}, {{base_scale_x}}, {{base_scale_y}}, {{char_id}}, {{char_name}}, {{dash_speed}}, {{dash_speed_todo}}, {{dj_array}}, {{fast_fall}}, {{fast_fall_todo}}, {{friction}}, {{gravity}}, {{gravity_todo}}, {{ground_speed_accel}}, {{ground_speed_cap}}, {{jump_speed}}, {{jump_speed_todo}}, {{run_speed_accel}}, {{run_speed_cap}}, {{run_speed_initial}}, {{short_hop}}, {{terminal_vel}}, {{terminal_vel_todo}}, {{walk_cap}}, {{walk_cap_todo}}, {{walk_speed_accel}}, {{walk_speed_initial}}, {{weight}}, {{weight_todo}}
char_stats_main = '''
// Character stats for {{char_name}} — converted from SSF2
// SSF2 physics values are scaled to Fraymakers equivalents.
// Review all values before use — units differ between engines.
{
	spriteContent: self.getResource().getContent("{{char_id}}"),

	// a fighter has to ASK for its shadow: the engine suppresses the draw unless the stats say
	// so, whatever the stage declares. left out, every converted fighter walks around casting
	// nothing, on its own stages and the official ones alike.
	shadows: true,

	//GENERIC STATS
	baseScaleX: {{base_scale_x}},
	baseScaleY: {{base_scale_y}},
	weight: {{weight}}{{weight_todo}},
	gravity: {{gravity}}{{gravity_todo}},
	shortHopSpeed: {{short_hop}}{{short_hop_todo}},
	jumpSpeed: {{jump_speed}}{{jump_speed_todo}},
	doubleJumpSpeeds: {{dj_array}},
	terminalVelocity: {{terminal_vel}}{{terminal_vel_todo}},
	fastFallSpeed: {{fast_fall}}{{fast_fall_todo}},
	friction: {{friction}}{{friction_todo}},
	walkSpeedInitial: {{walk_speed_initial}},
	walkSpeedAcceleration: {{walk_speed_accel}}{{walk_speed_accel_todo}},
	walkSpeedCap: {{walk_cap}}{{walk_cap_todo}},
	dashSpeed: {{dash_speed}}{{dash_speed_todo}},
	runSpeedInitial: {{run_speed_initial}},
	runSpeedAcceleration: {{run_speed_accel}},
	runSpeedCap: {{run_speed_cap}},
	groundSpeedAcceleration: {{ground_speed_accel}},
	groundSpeedCap: {{ground_speed_cap}},
	aerialSpeedAcceleration: {{aerial_speed_accel}}{{aerial_speed_accel_todo}},
	aerialSpeedCap: {{aerial_cap}}{{aerial_cap_todo}},
	aerialFriction: {{aerial_fric}}{{aerial_fric_todo}},

'''

# {{title}}
char_stats_section_comment = '''
	//{{title}}
'''

# {{anno}}, {{field}}, {{value}}
char_stats_field_anno = '''
	{{field}}: {{value}}{{anno}},
'''

# {{field}}, {{value}}
char_stats_field_plain = '''
	{{field}}: {{value}},
'''

char_stats_footer = '''
}
'''


# ── AnimationStats.hx ──
# {{char_name}}
anim_stats_header = '''
// Animation stats for {{char_name}} — converted from SSF2
// Many values are automatically set by the Common class.
// Entries here override those defaults.
{
'''

# {{body}}, {{name}}
anim_stats_entry = '''
	{{name}}: {{body}},
'''

anim_stats_split_header = '''

	//SSF2 SPLIT ANIMATIONS
'''

anim_stats_footer = '''
}
'''

